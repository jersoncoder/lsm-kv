[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "lsm-kv"
version = "0.1.0"
description = "An embedded key-value store built on a log-structured merge tree, in pure Python."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jerson Montes" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database :: Database Engines/Servers",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
    "mypy==2.4.0",
    "pytest>=8.0",
    "ruff==0.17.3",
]

[project.scripts]
lsm-kv = "lsm_kv.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lsm_kv"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "N"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "bench", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
